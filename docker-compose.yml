name: kafka-restore-lab
x-retention-env: &retention-env
  LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-7}"
  AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-7}"
  KAFKA_RETENTION_DAYS: "${KAFKA_RETENTION_DAYS:-7}"
  LOG_CLEANUP_ENABLED: "${LOG_CLEANUP_ENABLED:-true}"
  LOG_CLEANUP_INTERVAL_HOURS: "${LOG_CLEANUP_INTERVAL_HOURS:-24}"
x-logging: &service-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"
services:
  remote-db:
    logging: *service-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${REMOTE_ADMIN_PASSWORD:-lab-admin}"
      POSTGRES_DB: lab_remote
    ports:
      - "127.0.0.1:${REMOTE_DB_HOST_PORT:-55432}:5432"
    volumes:
      - remote_data:/var/lib/postgresql/data
      - ./sql/remote.sql:/docker-entrypoint-initdb.d/01-remote.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab_remote"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Opt-in SQL Server source for read-only DDL catalog experiments.
  remote-sqlserver:
    logging: *service-logging
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Lab-Strong-Pass-2026!}"
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-51433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  mssql-fixture:
    logging: *service-logging
    build: ./app
    image: &app-image kafka-restore-lab-app
    profiles: ["mssql-tools"]
    entrypoint: ["python", "-u", "/app/sqlserver_fixture.py"]
    command: ["init"]
    environment:
      MSSQL_HOST: remote-sqlserver
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Lab-Strong-Pass-2026!}"
    depends_on:
      - remote-sqlserver

  local-db:
    logging: *service-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${LOCAL_ADMIN_PASSWORD:-lab-admin}"
      POSTGRES_DB: lab_local
    ports:
      - "127.0.0.1:${LOCAL_DB_HOST_PORT:-55433}:5432"
    volumes:
      - local_data:/var/lib/postgresql/data
      - ./sql/local.sql:/docker-entrypoint-initdb.d/01-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab_local"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    logging: *service-logging
    image: apache/kafka:4.2.2
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,EXTERNAL://:9092,INTERNAL://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG4J_OPTS: '-Dlog4j2.configurationFile=/etc/kafka/lab-log4j2.yaml'
      KAFKA_GC_LOG_OPTS: '-Xlog:gc*:stdout:time,tags'
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./config/kafka-log4j2.yaml:/etc/kafka/lab-log4j2.yaml:ro

  toxiproxy:
    logging: *service-logging
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports:
      - "127.0.0.1:${TOXIPROXY_HOST_PORT:-8474}:8474"
    depends_on:
      remote-db:
        condition: service_healthy

  consumer:
    logging: *service-logging
    build: ./app
    image: *app-image
    environment: &app-env
      <<: *retention-env
      REMOTE_DSN: "${REMOTE_DSN:-host=toxiproxy port=15432 dbname=lab_remote user=remote_reader password=lab-reader connect_timeout=4}"
      REMOTE_DIRECT_DSN: "${REMOTE_DIRECT_DSN:-host=remote-db port=5432 dbname=lab_remote user=remote_reader password=lab-reader connect_timeout=4}"
      LOCAL_DSN: "host=local-db port=5432 dbname=lab_local user=postgres password=${LOCAL_ADMIN_PASSWORD:-lab-admin} connect_timeout=4"
      KAFKA_BOOTSTRAP: "${KAFKA_BOOTSTRAP:-kafka:19092}"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-lab.sync.events}"
      KAFKA_AUDIT_TOPIC: "${KAFKA_AUDIT_TOPIC:-lab.sync.audit}"
      MAX_REMOVE_FRACTION: "${MAX_REMOVE_FRACTION:-0.20}"
      SOURCE_SCHEMAS: "${SOURCE_SCHEMAS:-}"
      TOXIPROXY_URL: "${TOXIPROXY_URL:-http://toxiproxy:8474}"
    command: ["consume"]
    restart: unless-stopped
    depends_on:
      local-db:
        condition: service_healthy
      kafka:
        condition: service_started

  mssql-cli:
    logging: *service-logging
    build: ./app
    image: *app-image
    profiles: ["mssql-tools"]
    environment:
      <<: *app-env
      REMOTE_ENGINE: sqlserver
      MSSQL_HOST: "${MSSQL_HOST:-toxiproxy}"
      MSSQL_PORT: "${MSSQL_PORT:-15433}"
      MSSQL_USER: "${MSSQL_USER:-remote_reader}"
      MSSQL_PASSWORD: "${MSSQL_PASSWORD:-lab-reader}"
      MSSQL_DATABASE: "${MSSQL_DATABASE:-lab_remote}"
    depends_on:
      local-db:
        condition: service_healthy
      remote-sqlserver:
        condition: service_started
      toxiproxy:
        condition: service_started
    command: ["discover", "status"]

  mssql-scheduler:
    logging: *service-logging
    build: ./app
    image: *app-image
    init: true
    profiles: ["mssql-scheduled"]
    environment:
      <<: *app-env
      REMOTE_ENGINE: sqlserver
      MSSQL_HOST: "${MSSQL_HOST:-toxiproxy}"
      MSSQL_PORT: "${MSSQL_PORT:-15433}"
      MSSQL_USER: "${MSSQL_USER:-remote_reader}"
      MSSQL_PASSWORD: "${MSSQL_PASSWORD:-lab-reader}"
      MSSQL_DATABASE: "${MSSQL_DATABASE:-lab_remote}"
    command: ["discover", "schedule", "--interval", "${SCHEDULER_INTERVAL_SECONDS:-60}"]
    restart: unless-stopped
    stop_grace_period: 10m
    depends_on:
      - remote-sqlserver
      - toxiproxy
      - local-db
      - kafka

  cli:
    logging: *service-logging
    build: ./app
    image: *app-image
    environment: *app-env
    profiles: ["tools"]
    depends_on:
      local-db:
        condition: service_healthy
      kafka:
        condition: service_started
      toxiproxy:
        condition: service_started
    command: ["discover", "status"]

  seed-fixture:
    logging: *service-logging
    build: ./app
    image: *app-image
    profiles: ["tools"]
    environment:
      <<: *app-env
      # ADMIN only in this synthetic fixture service; not in producer/consumer.
      REMOTE_ADMIN_DSN: "host=remote-db port=5432 dbname=lab_remote user=postgres password=${REMOTE_ADMIN_PASSWORD:-lab-admin} connect_timeout=4"
    command: ["seed"]
    depends_on:
      remote-db:
        condition: service_healthy

  init:
    logging: *service-logging
    build: ./app
    image: *app-image
    environment: *app-env
    command: ["discover", "init", "--promotion-timeout", "${INIT_PROMOTION_TIMEOUT_SECONDS:-600}"]
    restart: "no"
    depends_on:
      remote-db:
        condition: service_healthy
      local-db:
        condition: service_healthy
      kafka:
        condition: service_started
      toxiproxy:
        condition: service_started
      consumer:
        condition: service_started

  scheduler:
    logging: *service-logging
    build: ./app
    image: *app-image
    init: true
    environment: *app-env
    command: ["discover", "schedule", "--interval", "${SCHEDULER_INTERVAL_SECONDS:-60}"]
    restart: unless-stopped
    stop_grace_period: 10m
    depends_on:
      local-db:
        condition: service_healthy
      kafka:
        condition: service_started
      toxiproxy:
        condition: service_started
      init:
        condition: service_completed_successfully

  # Independent monitor projection; no mirrored business rows.
  monitor-db:
    logging: *service-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${MONITOR_ADMIN_PASSWORD:-monitor-admin}"
      POSTGRES_DB: lab_monitor
    volumes:
      - monitor_data:/var/lib/postgresql/data
      - ./sql/monitor.sql:/docker-entrypoint-initdb.d/01-monitor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab_monitor"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The only monitor component that can SELECT local replication audit.
  monitor-collector:
    logging: *service-logging
    build: ./app
    image: *app-image
    entrypoint: ["python", "-u", "/app/monitor_collect.py"]
    environment:
      <<: *retention-env
      LOCAL_DSN: "host=local-db port=5432 dbname=lab_local user=monitor_reader password=monitor-reader connect_timeout=3"
      MONITOR_WRITE_DSN: "host=monitor-db port=5432 dbname=lab_monitor user=monitor_writer password=monitor-writer connect_timeout=3"
      KAFKA_BOOTSTRAP: "${KAFKA_BOOTSTRAP:-kafka:19092}"
      LAB_SYNC_MODE: "${LAB_SYNC_MODE:-catalog}"
      LAB_STALLED_MINUTES: "${LAB_STALLED_MINUTES:-15}"
      LAB_COVERAGE_WINDOW_HOURS: "${LAB_COVERAGE_WINDOW_HOURS:-24}"
      LAB_MAX_COVERAGE_INTERVALS: "${LAB_MAX_COVERAGE_INTERVALS:-20000}"
      LAB_MONITOR_COLLECTION_SECONDS: "${LAB_MONITOR_COLLECTION_SECONDS:-10}"
    depends_on:
      local-db:
        condition: service_started
      monitor-db:
        condition: service_healthy
    restart: unless-stopped

  # UI reads only its own DB and Kafka metadata; no mirror connection.
  monitor:
    logging: *service-logging
    build: ./app
    image: *app-image
    entrypoint: ["python", "-u", "/app/monitor.py"]
    environment:
      MONITOR_DSN: "host=monitor-db port=5432 dbname=lab_monitor user=monitor_reader password=monitor-reader connect_timeout=3"
      KAFKA_BOOTSTRAP: "${KAFKA_BOOTSTRAP:-kafka:19092}"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-lab.sync.events}"
      KAFKA_AUDIT_TOPIC: "${KAFKA_AUDIT_TOPIC:-lab.sync.audit}"
      LAB_CONSUMER_GROUP: lab-range-bluegreen-v4
      LAB_SYNC_MODE: "${LAB_SYNC_MODE:-catalog}"
      LAB_STALLED_MINUTES: "${LAB_STALLED_MINUTES:-15}"
      LAB_COVERAGE_WINDOW_HOURS: "${LAB_COVERAGE_WINDOW_HOURS:-24}"
      LAB_MAX_COVERAGE_INTERVALS: "${LAB_MAX_COVERAGE_INTERVALS:-20000}"
      LAB_EXPECTED_INTERVAL_MINUTES: "${LAB_EXPECTED_INTERVAL_MINUTES:-0}" # optional freshness alert; 0 disables it
      LAB_MAX_CONSUMER_LAG: "${LAB_MAX_CONSUMER_LAG:-1000}"
      LAB_MONITOR_PORT: "8082"
      LAB_MONITOR_COLLECTION_MAX_AGE: "${LAB_MONITOR_COLLECTION_MAX_AGE:-60}"
    ports:
      - "127.0.0.1:${MONITOR_HOST_PORT:-8082}:8082"
    depends_on:
      monitor-db:
        condition: service_healthy
      monitor-collector:
        condition: service_started
      kafka:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz',timeout=4).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  kafbat:
    logging: *service-logging
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:${KAFBAT_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "${KAFKA_BOOTSTRAP:-kafka:19092}"
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka

  adminer:
    logging: *service-logging
    image: adminer:5
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: local-db
    depends_on:
      local-db:
        condition: service_healthy

volumes:
  remote_data:
  local_data:
  kafka_data:
  mssql_data:
  monitor_data:
